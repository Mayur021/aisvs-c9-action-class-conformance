[project]
name = "reversibility-action-class-conformance"
version = "0.1.0"
description = "Reference implementation and conformance suite for reversibility-graded action-class authority (OWASP AISVS C9)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
