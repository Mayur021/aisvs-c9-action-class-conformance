    yet assert it. State outcome only.
  declared_effect: read_only
  consequence: LOW
  observation:
    binding: UNOBSERVED
  expect:
    reversibility: IRREVERSIBLE
    oversight: HUMAN_OWNS
    evidence_tier: highest

- id: real_chain_stalest_link
  description: >
    Three real tools from ONE registry server (token 004a96c25250baf5), binding
    states bound/stale/bound. The middle link's contract mutated after its
    declaration; the chain is as stale as its stalest link, so the whole
    composition is gated as though that step were unclassified - the
    worst-case-across-chain rule applied to the binding axis.
  chain:
    declared_effects: [read_only, read_only, read_only]
    consequences: [LOW, LOW, LOW]
    observations:
      - binding: BOUND
        age_days: 0
      - binding: STALE
      - binding: BOUND
        age_days: 0
  expect:
    reversibility: IRREVERSIBLE
    oversight: HUMAN_OWNS
    evidence_tier: highest
